<!doctype html>
<html lang="nl">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>FD Printing Center - Selfservice</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
   :root { --red: #dc2626; --ink: #18181b; --muted: #52525b; --bg: #f4f4f5; --card: #ffffff; }
   * { box-sizing: border-box; }
   body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;
          background: var(--bg); color: var(--ink); font-family: Manrope, system-ui, sans-serif; }
   .card { width: min(30rem, 100%); background: var(--card); border-radius: 1.5rem; overflow: hidden;
           box-shadow: 0 24px 60px rgba(0, 0, 0, .12); text-align: center; }
   .head { background: linear-gradient(135deg, #b91c1c, var(--red)); color: #fff; padding: 2rem 1.5rem; }
   .head p { margin: 0; font-size: .8rem; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; opacity: .85; }
   .head h1 { margin: .4rem 0 0; font-size: 2rem; font-weight: 800; }
   .body { padding: 1.75rem 1.5rem 2rem; }
   .body h2 { margin: 0; font-size: 1.2rem; }
   .body p { margin: .6rem 0 0; color: var(--muted); line-height: 1.55; }
  </style>
 </head>
 <body>
  <main class="card">
   <div class="head">
    <p>FD Printing Center</p>
    <h1>Selfservice</h1>
   </div>
   <div class="body">
    <h2>Welkom</h2>
    <p>Klant? Scan de QR-code op het scherm van de computer om je bestand te uploaden.</p>
    <p>Personeel? Gebruik de link van je eigen locatie om de computers te bedienen.</p>
   </div>
  </main>
 </body>
</html>
